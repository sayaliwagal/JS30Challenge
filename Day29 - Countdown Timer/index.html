<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Countdown Timer</title>
</head>
<body>
    <div class="timer">
        <div class="timer_controls">
            <button data-timer="20" class="timer_button">20 Secs</button>
            <button data-timer="300" class="timer_button">Work 5</button>
            <button data-timer="900" class="timer_button">Quick 15</button>
            <button data-timer="1200" class="timer_button">Snack 20</button>
            <button data-timer="3600" class="timer_button">Lunch Break</button>
            <form name="customForm" id="custom">
                <input type="text" name="minutes" placeholder="Enter Minutes">
            </form>
        </div>
        <div class="display">
            <h1 class="display_time-left"></h1>
            <p class="display_end-time"></p>
        </div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
